[project]
name = "ddakkok-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "opencv-contrib-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "alembic>=1.18.4",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults — 표준 FastAPI 패턴
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["harness-starter-kit/", "\\.venv/"]

[[tool.mypy.overrides]]
# cv2/numpy/torch에 완전한 타입 스텁이 없어 strict 모드에서 다수 오류 발생.
# 실제 버그가 아니므로 서비스 레이어는 오류 억제.
module = ["app.services._doctr", "app.services.image_processing"]
ignore_errors = true

[[tool.mypy.overrides]]
# OpenAI SDK function_call 오버로드와 tool_choice 타입이 우리의 str | dict 시그니처와
# 정확히 매칭되지 않음 (SDK 타입 스텁 한계). call-overload / misc 억제.
module = ["app.ai.openai"]
disable_error_code = ["call-overload", "misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

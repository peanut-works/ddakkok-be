services:
  backend:
    build: .
    container_name: ddakkok-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - uv_cache:/root/.cache/uv
    # --no-sync: 이미지에 baked된 /opt/venv(uv sync --frozen)를 그대로 사용.
    # 컨테이너 재생성(up -d)마다 의존성을 재동기화/재다운로드하지 않아 기동이 빠르다.
    # 의존성을 추가했다면 `docker compose build` 또는 `uv sync`로 갱신한다.
    command: uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    container_name: ddakkok-postgres
    environment:
      POSTGRES_DB: ddakkok
      POSTGRES_USER: ddakkok
      POSTGRES_PASSWORD: ddakkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddakkok -d ddakkok"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  uv_cache:

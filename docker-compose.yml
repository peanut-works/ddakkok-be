services:
  backend:
    build: .
    container_name: ddakkok-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    container_name: ddakkok-postgres
    environment:
      POSTGRES_DB: ddakkok
      POSTGRES_USER: ddakkok
      POSTGRES_PASSWORD: ddakkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddakkok -d ddakkok"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
